name: Build APK (Artifact only)

# Test-build pipeline: compiles the CURRENT version.properties (no bump) and
# uploads the APK as a workflow Artifact. No GitHub Release, no tag, no
# version bump, no push — so the in-app updater (which polls Releases) never
# sees it. The release pipeline stays in build.yml; the two are independent
# (separate concurrency groups) and never interfere.

on:
  workflow_dispatch:

# Independent of the release pipeline: an artifact build never cancels (and
# is never cancelled by) a release build.
concurrency:
  group: pockethub-build-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same signing source as build.yml: keystore decoded from repo secrets
      # onto the runner only (never committed). Missing secret → unsigned APK.
      - name: Decode signing keystore from repo secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set — building UNSIGNED APK"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "STORE_FILE=release.keystore"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing.properties
          chmod 600 release.keystore signing.properties

      # --no-bump: version.properties is left untouched, so the APK reports
      # the current committed version and the release pipeline's next bump is
      # unaffected.
      - name: Build APK (no version bump)
        run: |
          chmod +x build.sh
          ./build.sh --no-bump

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pockethub-apk
          path: apk/*.apk
          if-no-files-found: error
