name: Build Release APK

on:
  push:
    branches: [main, ui-redesign]
  workflow_dispatch:

# Never let two release jobs race over version.properties, APKs and tags.
concurrency:
  group: pockethub-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history made checkout grow to ~1 GB because every release APK
          # used to be committed. 50 commits is plenty for changelog generation
          # (we tag every build) while keeping the checkout small.
          fetch-depth: 50
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-signing.p12
          cat > signing.properties <<EOF
          STORE_FILE=release-signing.p12
          STORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=pockethub
          KEY_PASSWORD=$KEYSTORE_PASSWORD
          EOF
      - name: Build release APK (auto-bump version)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate bilingual changelog (AI-authored file first, then AI/fallback)
        run: |
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          # Preferred source: changelog/latest.json committed to the repo before
          # the build was triggered (authored by a local AI pass over this
          # round's actual changes — polished plain-language zh + en). Only used
          # when its version matches the version being built, so a stale file
          # can never describe the wrong release.
          if [ -f changelog/latest.json ]; then
            FILE_V=$(python3 -c "import json;print(json.load(open('changelog/latest.json')).get('version',''))" 2>/dev/null || echo "")
            if [ "$FILE_V" = "$VERSION_NAME" ]; then
              cp changelog/latest.json /tmp/changelog.json
              echo "Using AI-authored changelog/latest.json for v$VERSION_NAME"
            else
              echo "changelog/latest.json is for v$FILE_V, building v$VERSION_NAME — falling back to generation"
            fi
          fi
          # Fallback: generate from commit subjects (AI when LLM_API_KEY is set,
          # deterministic phrasing otherwise). Runs when no matching committed
          # changelog exists.
          if [ ! -f /tmp/changelog.json ]; then
            mapfile -t LOG_LINES < <(
              git log --pretty=format:'%s' -n 40 \
                --grep='chore: release' --invert-grep \
                --grep='\[skip ci\]' --invert-grep
            )
            printf '%s\n' "${LOG_LINES[@]}" > /tmp/commits.txt
            python3 scripts/gen_changelog.py /tmp/commits.txt > /tmp/changelog.json \
              || echo '{"items":[]}' > /tmp/changelog.json
          fi
          echo "changelog: $(cat /tmp/changelog.json)"

      # Expose the built APK as a workflow artifact so the run detail page
      # (GitHub web + PocketHub app) shows it under "Artifacts" per run.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pockethub-apk
          path: apk/*.apk
          if-no-files-found: error

      - name: Commit version bump + archived APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties apk/
          git commit -m "chore: release v$(grep '^versionName=' version.properties | cut -d= -f2) [skip ci]" || true
          git push

      - name: Create GitHub Release with APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          APK=$(ls apk/pockethub-${VERSION_NAME}.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "No APK found, skipping release"; exit 0; }

          # Structured bilingual changelog (generated in the earlier step).
          # Body layout: human-readable zh/en sections for the GitHub web page,
          # plus a single-line <!--pockethub-changelog {json}--> block that the
          # in-app update dialog reads directly (locale-matched, no runtime
          # translation). JSON is emitted on ONE line by design.
          CHANGELOG_JSON=$(cat /tmp/changelog.json 2>/dev/null || echo '{"items":[]}')
          NOTES_FILE=$(mktemp)
          python3 scripts/format_notes.py "${VERSION_NAME}" /tmp/changelog.json > "$NOTES_FILE"

          # Replace existing release/tag if re-running on the same version.
          gh release delete "v${VERSION_NAME}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VERSION_NAME}" "$APK" \
            --title "PocketHub v${VERSION_NAME}" \
            --notes-file "$NOTES_FILE"

          # Prune old releases/tags, keep only the newest 2.
          # `gh release list` output columns: Title / Type / Tag / Published
          # Sort by Published ascending so the oldest are at the top.
          mapfile -t ALL_TAGS < <(gh release list --json tagName --jq '.[].tagName' | sort -V -r)
          TOTAL=${#ALL_TAGS[@]}
          echo "Found $TOTAL releases, keeping newest 2"
          if [ "$TOTAL" -gt 2 ]; then
            for tag in "${ALL_TAGS[@]:2}"; do
              echo "Pruning old release+tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            done
          fi
